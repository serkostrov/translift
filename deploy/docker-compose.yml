# «Транслифт» на сервере: Caddy (HTTPS) → backend → PostgreSQL + SeaweedFS (файлы, S3).
# Наружу открыт только Caddy (80/443). База и хранилище файлов — во внутренней сети.
# Запуск из папки deploy:  docker compose --env-file .env up -d --build
name: translift-prod

# Запуск SeaweedFS: конфиг S3 с ключом доступа собирается из переменных окружения.
# В ключах не используйте кавычки и обратную косую черту (openssl rand -base64 их не выдаёт).
x-seaweed-start: &seaweed-start >-
  umask 077;
  printf '{"identities":[{"name":"translift","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
  "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json;
  chown seaweed /tmp/s3.json;
  exec /entrypoint.sh server -dir=/data -s3 -s3.config=/tmp/s3.json -volume.max=0

# Логи контейнеров: не больше 5 файлов по 10 МБ на сервис, иначе со временем займут весь диск
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  backend:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      API_PORT: 3000
      FRONTEND_ORIGIN: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SWAGGER: ${SWAGGER:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      COMPANY_NAME: ${COMPANY_NAME:-Транслифт}
      DATABASE_URL: postgresql://translift:${POSTGRES_PASSWORD}@postgres:5432/translift?schema=public
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: translift
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      # Нужны только для первого запуска seed (создание администратора)
      SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_RESET: ${SEED_ADMIN_RESET:-false}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  postgres:
    logging: *logging
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: translift
      POSTGRES_USER: translift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translift -d translift"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Хранилище файлов по протоколу S3. Наружу не открыто, пускает только с ключом
  # S3_ACCESS_KEY / S3_SECRET_KEY. Бакет создаёт backend при первом запуске.
  seaweedfs:
    logging: *logging
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["sh", "-c", *seaweed-start]
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  seaweeddata:
  caddy_data:
  caddy_config:
