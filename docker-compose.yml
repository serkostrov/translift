# Локальный запуск.
#   pnpm infra:up — только PostgreSQL + SeaweedFS (хранилище файлов S3), для разработки (pnpm dev)
#   pnpm app:up   — всё приложение целиком в Docker: http://localhost:8080
#                   (backend + web из deploy/Dockerfile, демо-данные, вход admin / password1234)
# Порты сдвинуты, чтобы не конфликтовать с другими проектами на машине.
name: translift

x-backend-env: &backend-env
  API_PORT: 3000
  FRONTEND_ORIGIN: http://localhost:8080
  COOKIE_SECURE: "false"
  SWAGGER: "false"
  APP_TIMEZONE: Europe/Moscow
  COMPANY_NAME: Транслифт Иваново
  DATABASE_URL: postgresql://translift:translift@postgres:5432/translift?schema=public
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: us-east-1
  S3_BUCKET: translift
  S3_ACCESS_KEY: translift
  S3_SECRET_KEY: translift-secret
  S3_FORCE_PATH_STYLE: "true"

# Запуск SeaweedFS: конфиг S3 с ключом доступа собирается из переменных окружения
x-seaweed-start: &seaweed-start >-
  umask 077;
  printf '{"identities":[{"name":"translift","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
  "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json;
  chown seaweed /tmp/s3.json;
  exec /entrypoint.sh server -dir=/data -s3 -s3.config=/tmp/s3.json -volume.max=0

# Логи контейнеров: не больше 5 файлов по 10 МБ на сервис, иначе со временем займут весь диск
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: translift
      POSTGRES_USER: translift
      POSTGRES_PASSWORD: translift
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translift -d translift"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Хранилище файлов по протоколу S3. Ключ доступа — из S3_ACCESS_KEY / S3_SECRET_KEY,
  # с другим ключом не пускает. Бакет создаёт backend при запуске.
  seaweedfs:
    logging: *logging
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: translift
      S3_SECRET_KEY: translift-secret
    entrypoint: ["sh", "-c", *seaweed-start]
    ports:
      - "9101:8333" # S3
      - "9102:8888" # просмотр файлов (filer)
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Приложение целиком (профиль app) ----------

  backend:
    logging: *logging
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    environment: *backend-env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Шаблоны этапов, администратор и демо-данные. Повторный запуск ничего не дублирует.
  seed:
    logging: *logging
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    environment:
      <<: *backend-env
      SEED_ADMIN_LOGIN: admin
      SEED_ADMIN_PASSWORD: ${SEED_PASSWORD:-password1234}
      SEED_DEMO_PASSWORD: ${SEED_PASSWORD:-password1234}
    command: ["sh", "-c", "npx prisma db seed && npx tsx prisma/seed-demo.ts"]
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

  web:
    logging: *logging
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ":80"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
