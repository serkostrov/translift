# Локальная инфраструктура для разработки: PostgreSQL + MinIO (S3).
# Порты сдвинуты, чтобы не конфликтовать с другими проектами на машине.
name: translift

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: translift
      POSTGRES_USER: translift
      POSTGRES_PASSWORD: translift
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translift -d translift"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: translift
      MINIO_ROOT_PASSWORD: translift-secret
    ports:
      - "9101:9000"
      - "9102:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 translift translift-secret &&
      mc mb --ignore-existing local/translift
      "

volumes:
  pgdata:
  miniodata:
