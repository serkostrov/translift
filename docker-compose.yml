# Локальный запуск.
#   pnpm infra:up — только PostgreSQL + MinIO, для разработки (pnpm dev)
#   pnpm app:up   — всё приложение целиком в Docker: http://localhost:8080
#                   (backend + web из deploy/Dockerfile, демо-данные, вход admin / password1234)
# Порты сдвинуты, чтобы не конфликтовать с другими проектами на машине.
name: translift

x-backend-env: &backend-env
  API_PORT: 3000
  FRONTEND_ORIGIN: http://localhost:8080
  COOKIE_SECURE: "false"
  APP_TIMEZONE: Europe/Moscow
  COMPANY_NAME: Транслифт Иваново
  DATABASE_URL: postgresql://translift:translift@postgres:5432/translift?schema=public
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: translift
  S3_ACCESS_KEY: translift
  S3_SECRET_KEY: translift-secret
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: translift
      POSTGRES_USER: translift
      POSTGRES_PASSWORD: translift
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translift -d translift"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: translift
      MINIO_ROOT_PASSWORD: translift-secret
    ports:
      - "9101:9000"
      - "9102:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 translift translift-secret &&
      mc mb --ignore-existing local/translift
      "

  # ---------- Приложение целиком (профиль app) ----------

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    environment: *backend-env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Шаблоны этапов, администратор и демо-данные. Повторный запуск ничего не дублирует.
  seed:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    environment:
      <<: *backend-env
      SEED_ADMIN_LOGIN: admin
      SEED_ADMIN_PASSWORD: ${SEED_PASSWORD:-password1234}
      SEED_DEMO_PASSWORD: ${SEED_PASSWORD:-password1234}
    command: ["sh", "-c", "npx prisma db seed && npx tsx prisma/seed-demo.ts"]
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ":80"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
