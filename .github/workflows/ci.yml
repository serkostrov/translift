# Проверка на каждый push в main и на каждый pull request:
# линтер, типы, unit- и e2e-тесты (с настоящими PostgreSQL и SeaweedFS), сборка фронтенда
# и рабочих Docker-образов. Ничего не выкладывает — только проверяет.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Линтер, типы, тесты, сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Настройки для локального запуска
        run: cp backend/.env.example backend/.env

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Линтер (Biome)
        run: pnpm lint

      - name: Типы
        run: pnpm typecheck

      - name: Unit-тесты
        run: pnpm test

      - name: PostgreSQL и SeaweedFS
        run: |
          docker compose up -d --wait postgres seaweedfs
          docker compose exec -T postgres createdb -U translift translift_test

      - name: e2e-тесты
        run: pnpm --filter backend test:e2e

      - name: Сборка фронтенда
        run: pnpm --filter frontend build

      - name: Журналы сервисов при ошибке
        if: failure()
        run: docker compose logs --tail=100 postgres seaweedfs

  docker:
    name: Рабочие Docker-образы
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: false
          cache-from: type=gha
